services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: gislapp_app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    working_dir: /var/www
    depends_on:
      - db
      - redis
    networks:
      - gislapp

  web:
    image: nginx:alpine
    container_name: gislapp_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gislapp

  db:
    image: mysql:8.0
    container_name: gislapp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gislapp
      MYSQL_USER: gislapp
      MYSQL_PASSWORD: gislapp
    command: --log-bin-trust-function-creators=1 --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./copiaDb:/copiaDb:ro
    networks:
      - gislapp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gislapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gislapp
    command: redis-server --appendonly yes

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: gislapp_node
    restart: unless-stopped
    volumes:
      - ./:/var/www
    working_dir: /var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - gislapp

  mailpit:
    image: axllent/mailpit:latest
    container_name: gislapp_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gislapp

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: gislapp_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 300M
    depends_on:
      - db
    networks:
      - gislapp

volumes:
  mysql_data:
  redis_data:

networks:
  gislapp:
    driver: bridge
